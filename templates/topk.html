{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block content %}
<section class="card">
  <h2>Top-K Analysis</h2>
  <form method="get">
    <label>Metric <select name="metric">
      {% for key, label in metrics.items() %}<option value="{{ key }}" {{ 'selected' if key == metric }}>{{ label }}</option>{% endfor %}
    </select></label>
    <label>K <input type="number" name="k" value="{{ k }}" min="1" max="100"></label>
    <button>RUN</button>
  </form>
  {% if result %}<h3>{{ result.title }} (K={{ k }})</h3>{{ m.table(result.headers, result.rows) }}{% endif %}
  <p class="muted">Computed with a bounded min-heap (heapq): O(n log k).</p>
</section>
{% endblock %}
