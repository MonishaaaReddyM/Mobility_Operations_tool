<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mobility Operations Intelligence{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>Mobility Operations Intelligence</h1>
  <nav>
    <a href="{{ url_for('index') }}">Load Data</a>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('drivers') }}">Drivers</a>
    <a href="{{ url_for('zones') }}">Zones</a>
    <a href="{{ url_for('topk') }}">Top-K</a>
    <a href="{{ url_for('cancellations') }}">Cancellations</a>
    <a href="{{ url_for('utilization') }}">Utilization</a>
    <a href="{{ url_for('anomalies') }}">Anomalies</a>
    <a href="{{ url_for('search') }}">Search</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
